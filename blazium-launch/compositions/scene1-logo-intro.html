    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = '[data-composition-id="scene1-logo-intro"]';
        const tl = gsap.timeline({ paused: true });
        const letters = gsap.utils.toArray(`${root} .letter`);
        const ring = `${root} .ring`;
        const wordmark = `${root} .wordmark`;
        const sub = `${root} .sub`;
        const corners = [`${root} .corner-tl`, `${root} .corner-br`];
        const bloom = `${root} .bg-bloom`;

        gsap.set(letters, { y: 120, opacity: 0, rotateX: -80 });
        gsap.set(sub, { opacity: 0, y: 24, letterSpacing: "0.5em" });
        gsap.set(corners, { scale: 0.6, opacity: 0 });

        tl.to(bloom, { opacity: 1, duration: 0.01 }, 0);
        tl.to(
          letters,
          {
            y: 0,
            opacity: 1,
            rotateX: 0,
            duration: 0.55,
            stagger: 0.045,
            ease: "back.out(1.35)",
          },
          0.05,
        );
        tl.to(sub, { opacity: 1, y: 0, letterSpacing: "0.28em", duration: 0.45, ease: "power3.out" }, 0.35);
        tl.to(corners, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.5);

        tl.fromTo(
          ring,
          { scale: 0.35, opacity: 0.95 },
          { scale: 2.2, opacity: 0, duration: 0.55, ease: "power2.out" },
          0.72,
        );

        tl.to(wordmark, { scale: 1.04, duration: 0.12, ease: "power2.out" }, 0.85);
        tl.to(wordmark, { scale: 1, duration: 0.18, ease: "power2.in" }, 0.97);

        tl.to([wordmark, sub, ...corners, `${root} .meta-strip`], { opacity: 0, y: -40, duration: 0.35, ease: "power3.in" }, 1.55);
        tl.to(`${root} .ghost-type`, { opacity: 0, duration: 0.25 }, 1.55);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-logo-intro"] = tl;
      })();
    </script>
