<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>Hub tabs</title>
  <desc>Four screens. CLI does the mutations. CDN feeds Editors and News.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e070ff"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="118" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">Hub tabs</text>
  <rect x="80" y="360" width="420" height="360" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="290.0" y="528.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Projects</text>
<text x="290.0" y="562.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">add / scan / open / favorite</text>  <rect x="540" y="360" width="420" height="360" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="750.0" y="528.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Editors</text>
<text x="750.0" y="562.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">release · prerelease · nightly</text>  <rect x="1000" y="360" width="420" height="360" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1210.0" y="528.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">News</text>
<text x="1210.0" y="562.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">CDN rss.xml  ·  this repo</text>  <rect x="1460" y="360" width="420" height="360" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1670.0" y="528.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Settings</text>
<text x="1670.0" y="562.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">CLI path, install path, tray</text><text x="80" y="860" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="start">Windows tray: Show Hub, recent projects, Quit. Close-to-tray is a Settings checkbox.</text></svg>
