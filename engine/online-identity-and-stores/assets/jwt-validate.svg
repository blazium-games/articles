<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>JWT validation</title>
  <desc>Issue, kid, verify, reject expired.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e070ff"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="118" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">JWT validation</text>
  <rect x="80" y="420" width="300" height="180" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="230.0" y="498.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">1. Issue</text>
<text x="230.0" y="532.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">JWTBuilder  HS256 / RS256</text>  <rect x="460" y="420" width="300" height="180" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="610.0" y="498.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">2. kid</text>
<text x="610.0" y="532.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">select signing key</text>  <rect x="840" y="420" width="300" height="180" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="990.0" y="498.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">3. Verify</text>
<text x="990.0" y="532.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">signature  ·  claims</text>  <rect x="1220" y="280" width="600" height="180" rx="14" fill="#1c1828" stroke="#3dcc8a" stroke-width="2"/>
  <text x="1520.0" y="370.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Grant</text>
  <rect x="1220" y="560" width="600" height="180" rx="14" fill="#1c1828" stroke="#e25b6a" stroke-width="2"/>
  <text x="1520.0" y="638.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Reject</text>
<text x="1520.0" y="672.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">expired, bad sig, revoked</text>  <line x1="380" y1="510" x2="460" y2="510" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="510" x2="840" y2="510" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1140" y1="470" x2="1220" y2="370" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1140" y1="550" x2="1220" y2="650" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
