<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>cdn.blazium.app</title>
  <desc>Sibling trees on the same bucket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e070ff"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="118" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">cdn.blazium.app</text>
  <rect x="160" y="240" width="1600" height="720" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="960.0" y="600.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle"></text>
<text x="220" y="280" fill="#e070ff" font-family="Consolas, Cascadia Mono, monospace" font-size="28">cdn.blazium.app/</text>
<text x="220" y="360" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="28">  {channel}/{version}/     editors + export templates</text>
<text x="220" y="440" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="28">  cli/                     blazium-cli binaries + cli.json</text>
<text x="220" y="520" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="28">  hub/                     Hub installers</text>
<text x="220" y="600" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="28">  crash_reporter/          sidecar builds</text>
<text x="220" y="680" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="28">  articles/                rss.xml, bbcode, assets  (Hub News)</text>
<text x="220" y="760" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="28">  catalog/versions/        nightly.json, release.json</text>
