<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>MIT engine, GPLv3 toolchain</title>
  <desc>The editor spawns blazium-toolchain. Compilers never live in blazium.git.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e070ff"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="118" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">MIT engine, GPLv3 toolchain</text>
  <rect x="120" y="300" width="780" height="520" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="510.0" y="548.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Blazium Engine</text>
<text x="510.0" y="582.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">MIT  ·  blazium.git</text>  <rect x="1020" y="300" width="780" height="520" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1410.0" y="548.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">blazium-toolchain</text>
<text x="1410.0" y="582.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">GPL-3.0-or-later</text><text x="510" y="520" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" text-anchor="middle">editor binary</text><text x="510" y="580" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" text-anchor="middle">spawns, does not vendor</text><text x="1410" y="500" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" text-anchor="middle">ps1 setup / build / run</text><text x="1410" y="560" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" text-anchor="middle">interdvd iso</text><text x="1410" y="620" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" text-anchor="middle">GCC, PSn00bSDK, pcsx-redux</text>  <line x1="900" y1="560" x2="1020" y2="560" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="960.0" y="548.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" text-anchor="middle">spawn</text><text x="80" y="920" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="start">PS1, PS2, and N64 run on Windows and Linux. ps3 and ps4 are reserved and exit 2.</text></svg>
