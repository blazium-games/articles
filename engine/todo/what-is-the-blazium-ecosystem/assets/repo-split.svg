<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>One product, several repositories</title>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="124" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">One product, several repositories</text>
  <text x="64" y="168" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">The editor is MIT. The tools around it are separate repos that share the CDN.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/></marker></defs><rect x="80" y="280" width="480" height="150" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="320.0" y="347.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">blazium</text>
  <text x="320.0" y="379.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">MIT editor, modules</text><rect x="640" y="280" width="480" height="150" rx="14" fill="#1c1828" stroke="#e070ff" stroke-width="2"/>
  <text x="880.0" y="347.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">blazium-cli</text>
  <text x="880.0" y="379.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">install, open, deploy</text><rect x="1200" y="280" width="620" height="150" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1510.0" y="347.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">blazium-hub</text>
  <text x="1510.0" y="379.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">window over the CLI</text><rect x="80" y="540" width="480" height="150" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="320.0" y="607.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">blazium-toolchain</text>
  <text x="320.0" y="639.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">GPL-3.0 compilers</text><rect x="640" y="540" width="480" height="150" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="880.0" y="607.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">crash sidecar</text>
  <text x="880.0" y="639.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">confirm, then upload</text><rect x="1200" y="540" width="620" height="150" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1510.0" y="607.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">cdn.blazium.app</text>
  <text x="1510.0" y="639.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">the files everyone reads</text><line x1="560" y1="355" x2="640" y2="355" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1120" y1="355" x2="1200" y2="355" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="64" y="1028" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">Hub and the crash sidecar track the blazium_4.8 line. The 0.6 editors on the CDN are blazium-dev.</text>
</svg>
