<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>What the toolchain binary actually builds</title>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="124" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">What the toolchain binary actually builds</text>
  <text x="64" y="168" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">The editor spawns it for Interactive DVD. The consoles are terminal commands.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/></marker></defs><rect x="80" y="300" width="400" height="160" rx="14" fill="#1c1828" stroke="#e070ff" stroke-width="2"/>
  <text x="280.0" y="372.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Interactive DVD</text>
  <text x="280.0" y="404.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">editor export + interdvd iso</text><rect x="540" y="300" width="400" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="740.0" y="372.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">PS1</text>
  <text x="740.0" y="404.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">ps1 setup / build / iso</text><rect x="1000" y="300" width="400" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1200.0" y="372.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">PS2</text>
  <text x="1200.0" y="404.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">ps2 setup / build / iso</text><rect x="1460" y="300" width="380" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1650.0" y="372.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">N64</text>
  <text x="1650.0" y="404.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">.z64, not an ISO</text><rect x="540" y="600" width="860" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="970.0" y="672.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">ps3 and ps4</text>
  <text x="970.0" y="704.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">reserved names, exit code 2</text><rect x="1460" y="600" width="380" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1650.0" y="672.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">macOS publish</text>
  <text x="1650.0" y="704.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">no official binary</text>
  <text x="64" y="1028" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">PS1 ISO uses mkpsxiso. Interactive DVD writes ISO9660 and UDF in process. No mkisofs.</text>
</svg>
