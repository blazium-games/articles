<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="1766" viewBox="0 0 1648 1766" role="img">
  <title>blazium-toolchain</title>
  <rect width="1648" height="1766" rx="10" fill="#121018"/>
  <text x="24" y="28" fill="#e070ff" font-family="Consolas, Cascadia Mono, monospace" font-size="13">asciinema</text>
  <text x="24" y="64" fill="#e070ff" font-family="Consolas, Cascadia Mono, monospace" font-size="16">$ blazium-toolchain</text>
  <text x="24" y="86" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">blazium-toolchain — official Blazium console toolchain manager</text>
  <text x="24" y="108" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="130" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Usage:</text>
  <text x="24" y="152" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  blazium-toolchain [--json] [--prefix DIR] [--settings FILE] version</text>
  <text x="24" y="174" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  blazium-toolchain [--json] [--prefix DIR] [--settings FILE] list</text>
  <text x="24" y="196" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  blazium-toolchain [--json] [--settings FILE] settings</text>
  <text x="24" y="218" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  blazium-toolchain [--json] [--prefix DIR] [--settings FILE] &lt;platform&gt; &lt;command&gt; [flags]</text>
  <text x="24" y="240" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="262" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Project YAML: --settings, $BLAZIUM_TOOLCHAIN_SETTINGS, or ./blazium-toolchain.yml (walk up).</text>
  <text x="24" y="284" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="306" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Platforms:</text>
  <text x="24" y="328" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  ps1       supported (PlayStation 1)</text>
  <text x="24" y="350" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  ps2       supported (PlayStation 2; Windows/Linux; guest bundled in this CLI)</text>
  <text x="24" y="372" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  n64       supported (Nintendo 64; Windows/Linux; guest bundled; product .z64)</text>
  <text x="24" y="394" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  interdvd  supported (Interactive DVD ISO9660+UDF)</text>
  <text x="24" y="416" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  steam     supported (Valve steamcmd cache for blazium-cli deploy)</text>
  <text x="24" y="438" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  ps3       planned</text>
  <text x="24" y="460" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  ps4       planned</text>
  <text x="24" y="482" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="504" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">PS1/PS2/N64 host tools: Windows and Linux only. setup/build/run/iso/rom exit 2 on other OSes.</text>
  <text x="24" y="526" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="548" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">PS1 commands:</text>
  <text x="24" y="570" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  setup [--profile compile|dev|iso] [--offline]</text>
  <text x="24" y="592" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  env</text>
  <text x="24" y="614" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  status</text>
  <text x="24" y="636" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  build --out FILE [--src DIR | --sample template|gte] [--overlay DIR] [--export-src DIR]</text>
  <text x="24" y="658" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">    [--tim|--mesh|--vag|--sprite|--script|--gdbc|--luau|--str|--xa|--node|--hud|--tile|--scene|--anim|--cam|--hit|--nav|--path|--way]</text>
  <text x="24" y="680" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  export-guest [--out DIR]</text>
  <text x="24" y="702" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  run [--iso CUE] [--timeout 120s] [--ui] [GAME.EXE]</text>
  <text x="24" y="724" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  iso --xml FILE [--out PATH]</text>
  <text x="24" y="746" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  fmv</text>
  <text x="24" y="768" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="790" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">PS2 commands:</text>
  <text x="24" y="812" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  setup [--profile compile|dev|iso] [--offline]</text>
  <text x="24" y="834" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  env</text>
  <text x="24" y="856" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  status</text>
  <text x="24" y="878" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  build --out FILE.elf [--src DIR | --sample cube] [--overlay DIR] [--export-src DIR]</text>
  <text x="24" y="900" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">    [--node|--mesh|--gtex|--script]</text>
  <text x="24" y="922" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  export-guest [--out DIR]</text>
  <text x="24" y="944" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  run [--iso FILE.iso] [--timeout 120s] [--ui] [GAME.elf]</text>
  <text x="24" y="966" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  iso --dir TREE --out FILE.iso</text>
  <text x="24" y="988" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  elf-info FILE.elf</text>
  <text x="24" y="1010" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  chd --iso FILE.iso --out FILE.chd</text>
  <text x="24" y="1032" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="1054" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Steam commands (steamcmd only; upload lives in blazium-cli):</text>
  <text x="24" y="1076" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  setup [--offline]</text>
  <text x="24" y="1098" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  env</text>
  <text x="24" y="1120" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  status</text>
  <text x="24" y="1142" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="1164" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Interactive DVD commands:</text>
  <text x="24" y="1186" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  setup [--offline]</text>
  <text x="24" y="1208" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  env</text>
  <text x="24" y="1230" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  status</text>
  <text x="24" y="1252" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  ffmpeg -- &lt;args&gt;</text>
  <text x="24" y="1274" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  ffprobe -- &lt;args&gt;</text>
  <text x="24" y="1296" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  iso --dir DIR --out FILE [--meta FILE] [--write-meta FILE] [--volume ID] [--title TEXT]</text>
  <text x="24" y="1318" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      [--copyright TEXT] [--license TEXT] [--extra HOST[:DISC]] [--extras-dir DIR] [--recursive]</text>
  <text x="24" y="1340" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  meta init --out FILE</text>
  <text x="24" y="1362" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  meta validate --meta FILE</text>
  <text x="24" y="1384" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="1406" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">N64 commands:</text>
  <text x="24" y="1428" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  setup [--profile compile|dev|rom] [--offline]</text>
  <text x="24" y="1450" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  env</text>
  <text x="24" y="1472" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  status</text>
  <text x="24" y="1494" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  build --out FILE.z64 [--src DIR | --sample helloworld|rdpqdemo|t3dquad|ovldemo] [--overlay DIR] [--export-src DIR]</text>
  <text x="24" y="1516" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">    [--display 320|640] [--rumble] [--rdram 8|4] [--ntex|--mesh|--node|--inp|--sfx|--music|--pack|--pack-dir|--script|--gdbc|--luau]</text>
  <text x="24" y="1538" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  export-guest [--out DIR]</text>
  <text x="24" y="1560" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  run [--emu ares|project64|both] [--timeout 120s] [--rdram 8|4] GAME.z64</text>
  <text x="24" y="1582" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  rom --dir TREE --out FILE.z64 [--elf FILE.elf]</text>
  <text x="24" y="1604" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="1626" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Cache: &lt;prefix&gt;/&lt;plat&gt;/ (inst, src, guest, work). Portable copy: &lt;exeDir&gt;/&lt;plat&gt;/.</text>
  <text x="24" y="1648" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">License: GPL-3.0-or-later (this repo may contain GCC, PSn00bSDK, mkpsxiso, pcsx-redux, ps2dev, libdragon, Ares).</text>
  <text x="24" y="1670" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">The 3rd-party installer should invoke this binary (not the Blazium editor).</text>
  <text x="24" y="1692" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="1714" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">(exit 1)</text>
  <text x="24" y="1736" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
</svg>
