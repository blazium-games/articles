<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>How a template pack is found</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/></marker></defs>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="124" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">How a template pack is found</text>
  <text x="64" y="168" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">The editor and the CLI do not share a first hop.</text>
  <text x="80" y="230" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600">EDITOR TODAY</text>
  <rect x="80" y="250" width="480" height="140" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="320" y="308" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Export Template Manager</text>
  <text x="320" y="342" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">mirror_list + version.channel.json</text>
  <line x1="560" y1="320" x2="680" y2="320" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="680" y="250" width="520" height="140" rx="14" fill="#1c1828" stroke="#e070ff" stroke-width="2"/>
  <text x="940" y="308" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Live mirrorlist</text>
  <text x="940" y="342" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">one entry: GitHub release .tpz</text>
  <line x1="1200" y1="320" x2="1320" y2="320" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1320" y="250" width="520" height="140" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1580" y="308" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Unpack</text>
  <text x="1580" y="342" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">folder {version}.{channel}</text>
  <text x="80" y="470" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600">CLI TODAY</text>
  <rect x="80" y="490" width="480" height="140" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="320" y="548" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">blazium-cli</text>
  <text x="320" y="582" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">install --templates</text>
  <line x1="560" y1="560" x2="680" y2="560" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="680" y="490" width="520" height="140" rx="14" fill="#1c1828" stroke="#e070ff" stroke-width="2"/>
  <text x="940" y="548" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">cdn.blazium.app</text>
  <text x="940" y="582" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">template_files.json, then details.json</text>
  <line x1="1200" y1="560" x2="1320" y2="560" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1320" y="490" width="520" height="140" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1580" y="548" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Template root</text>
  <text x="1580" y="582" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">same version folder</text>
  <rect x="80" y="720" width="1760" height="200" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="110" y="790" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="600">Rolling out, not what the editor sees yet</text>
  <text x="110" y="840" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">details.json on the CDN lists the CDN pack first and the GitHub release second.</text>
  <text x="110" y="876" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">blazium.app templates.go already reads that file. The live mirrorlist response is still GitHub only.</text>
</svg>
