<text x="960.0" y="342.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">HTTP + WebSocket  ·  Blazium Services nodes</text>  <rect x="200" y="400" width="1520" height="120" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
