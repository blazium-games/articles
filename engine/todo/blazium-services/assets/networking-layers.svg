<text x="960.0" y="622.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">SocketIOClient  ·  rooms, reconnect</text>  <rect x="200" y="680" width="1520" height="120" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
