<text x="960.0" y="482.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">In-engine HTTP  ·  remote_control and JustAMCP bind here</text>  <rect x="200" y="540" width="1520" height="120" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
