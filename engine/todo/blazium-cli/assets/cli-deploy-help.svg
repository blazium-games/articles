<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="644" viewBox="0 0 1648 644" role="img">
  <title>blazium-cli deploy --help</title>
  <rect width="1648" height="644" rx="10" fill="#121018"/>
  <text x="24" y="28" fill="#e070ff" font-family="Consolas, Cascadia Mono, monospace" font-size="13">asciinema</text>
  <text x="24" y="64" fill="#e070ff" font-family="Consolas, Cascadia Mono, monospace" font-size="16">$ blazium-cli deploy --help</text>
  <text x="24" y="86" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Store deploy commands. Secrets stay in BLAZIUM_* env or ${NAME} references in blazium-deploy.yml.</text>
  <text x="24" y="108" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="130" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">steam-sync login tokens are full Steam account access; use deploy itch steam-logout to delete local creds.</text>
  <text x="24" y="152" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Builder password/shared_secret are never written unless you opt into a local maFile.</text>
  <text x="24" y="174" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">CI should set BLAZIUM_STEAM_* / BLAZIUM_BUTLER_API_KEY rather than running guard setup on the runner.</text>
  <text x="24" y="196" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="218" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Usage:</text>
  <text x="24" y="240" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  blazium-cli deploy [command]</text>
  <text x="24" y="262" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="284" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Available Commands:</text>
  <text x="24" y="306" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  itch        itch.io push and Steam→itch steam-sync</text>
  <text x="24" y="328" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  steam       SteamCMD upload, Guard, and SetAppBuildLive</text>
  <text x="24" y="350" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  tools       steamcmd via blazium-toolchain</text>
  <text x="24" y="372" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="394" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Flags:</text>
  <text x="24" y="416" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --config string   Path to blazium-deploy.yml (default: walk up from cwd)</text>
  <text x="24" y="438" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  -h, --help            help for deploy</text>
  <text x="24" y="460" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="482" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Global Flags:</text>
  <text x="24" y="504" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --format string   Output format: human, json, or tsv (default "human")</text>
  <text x="24" y="526" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --json            Emit JSON on stdout (shorthand for --format json; implies --quiet)</text>
  <text x="24" y="548" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --quiet           Suppress warnings and non-fatal notices</text>
  <text x="24" y="570" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="592" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Use "blazium-cli deploy [command] --help" for more information about a command.</text>
  <text x="24" y="614" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
</svg>
