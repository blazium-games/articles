<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="820" viewBox="0 0 1648 820" role="img">
  <title>blazium-cli games --help</title>
  <rect width="1648" height="820" rx="10" fill="#121018"/>
  <text x="24" y="28" fill="#e070ff" font-family="Consolas, Cascadia Mono, monospace" font-size="13">asciinema</text>
  <text x="24" y="64" fill="#e070ff" font-family="Consolas, Cascadia Mono, monospace" font-size="16">$ blazium-cli games --help</text>
  <text x="24" y="86" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Blazium Games service uploads (formerly chauffeur).</text>
  <text x="24" y="108" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="130" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Auth: --access/--secret, blazium-deploy.yml games:, or BLAZIUM_ACCESS_TOKEN / BLAZIUM_SECRET_KEY.</text>
  <text x="24" y="152" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">The DigitalOcean Spaces plumber (games_cli/cmd/upload) is not part of this command.</text>
  <text x="24" y="174" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="196" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Usage:</text>
  <text x="24" y="218" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  blazium-cli games [command]</text>
  <text x="24" y="240" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="262" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Aliases:</text>
  <text x="24" y="284" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  games, chauffeur</text>
  <text x="24" y="306" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="328" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Available Commands:</text>
  <text x="24" y="350" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  addchangelog Add a changelog entry to build.yml</text>
  <text x="24" y="372" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  addfiles     Upload files using a YAML configuration file</text>
  <text x="24" y="394" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  build        Upload a build using a YAML configuration file</text>
  <text x="24" y="416" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  genbuild     Generate a new build.yml file</text>
  <text x="24" y="438" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  setfiles     Generate a new addfiles.yml file</text>
  <text x="24" y="460" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="482" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Flags:</text>
  <text x="24" y="504" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --access string   Blazium access token (overrides BLAZIUM_ACCESS_TOKEN)</text>
  <text x="24" y="526" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --config string   Path to blazium-deploy.yml</text>
  <text x="24" y="548" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  -h, --help            help for games</text>
  <text x="24" y="570" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --secret string   Blazium secret key (overrides BLAZIUM_SECRET_KEY)</text>
  <text x="24" y="592" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --upload string   Upload service base URL (overrides BLAZIUM_UPLOAD_URL)</text>
  <text x="24" y="614" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --url string      API base URL (overrides BLAZIUM_API_URL)</text>
  <text x="24" y="636" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="658" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Global Flags:</text>
  <text x="24" y="680" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --format string   Output format: human, json, or tsv (default "human")</text>
  <text x="24" y="702" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --json            Emit JSON on stdout (shorthand for --format json; implies --quiet)</text>
  <text x="24" y="724" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --quiet           Suppress warnings and non-fatal notices</text>
  <text x="24" y="746" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="768" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Use "blazium-cli games [command] --help" for more information about a command.</text>
  <text x="24" y="790" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
</svg>
