<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="578" viewBox="0 0 1648 578" role="img">
  <title>blazium-cli starters --help</title>
  <rect width="1648" height="578" rx="10" fill="#121018"/>
  <text x="24" y="28" fill="#e070ff" font-family="Consolas, Cascadia Mono, monospace" font-size="13">asciinema</text>
  <text x="24" y="64" fill="#e070ff" font-family="Consolas, Cascadia Mono, monospace" font-size="16">$ blazium-cli starters --help</text>
  <text x="24" y="86" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Work with project starters from https://cdn.blazium.app/starters/starters.json.</text>
  <text x="24" y="108" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="130" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">These are game projects. Export templates stay on the templates command.</text>
  <text x="24" y="152" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Each catalog entry includes github and git so a failed unzip can be cloned.</text>
  <text x="24" y="174" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="196" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Usage:</text>
  <text x="24" y="218" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  blazium-cli starters [command]</text>
  <text x="24" y="240" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="262" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Available Commands:</text>
  <text x="24" y="284" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  download    Download a project starter into a directory</text>
  <text x="24" y="306" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  list        List project starters</text>
  <text x="24" y="328" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="350" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Flags:</text>
  <text x="24" y="372" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">  -h, --help   help for starters</text>
  <text x="24" y="394" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="416" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Global Flags:</text>
  <text x="24" y="438" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --format string   Output format: human, json, or tsv (default "human")</text>
  <text x="24" y="460" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --json            Emit JSON on stdout (shorthand for --format json; implies --quiet)</text>
  <text x="24" y="482" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">      --quiet           Suppress warnings and non-fatal notices</text>
  <text x="24" y="504" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
  <text x="24" y="526" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16">Use "blazium-cli starters [command] --help" for more information about a command.</text>
  <text x="24" y="548" fill="#f4eefc" font-family="Consolas, Cascadia Mono, monospace" font-size="16"></text>
</svg>
