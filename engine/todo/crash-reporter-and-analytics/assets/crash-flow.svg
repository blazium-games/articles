<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>Confirm, then upload</title>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="124" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">Confirm, then upload</text>
  <text x="64" y="168" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">The engine writes the files. The sidecar is the thing that asks.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/></marker></defs><rect x="80" y="320" width="380" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="270.0" y="392.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Breakpad in-process</text>
  <text x="270.0" y="424.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">Windows and Linux/BSD</text><rect x="540" y="320" width="380" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="730.0" y="392.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">{id}.dmp + {id}.json</text>
  <text x="730.0" y="424.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">crash directory on disk</text><rect x="1000" y="320" width="380" height="160" rx="14" fill="#1c1828" stroke="#e070ff" stroke-width="2"/>
  <text x="1190.0" y="392.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">crash_reporter UI</text>
  <text x="1190.0" y="424.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">Send or Discard</text><rect x="1460" y="320" width="380" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1650.0" y="392.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">POST /v1/reports</text>
  <text x="1650.0" y="424.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">only after confirm</text><line x1="460" y1="400" x2="540" y2="400" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="920" y1="400" x2="1000" y2="400" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1380" y1="400" x2="1460" y2="400" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="540" y="640" width="840" height="150" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="960.0" y="707.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Editor builds</text>
  <text x="960.0" y="739.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">HTTP upload is compiled out. Files stay local unless a sidecar is set.</text>
  <text x="64" y="1028" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">Hub's bake posts to https://crash.blazium.app/v1/reports. A game does not inherit that URL.</text>
</svg>
