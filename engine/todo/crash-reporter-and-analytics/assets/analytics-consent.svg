<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>Analytics stays queued until consent</title>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="124" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">Analytics stays queued until consent</text>
  <text x="64" y="168" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">First match wins. Anonymous mode is the default.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/></marker></defs><rect x="70" y="300" width="400" height="140" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="270.0" y="362.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">1. --analytics=</text>
  <text x="270.0" y="394.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">accepted or declined</text><rect x="520" y="300" width="420" height="140" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="730.0" y="362.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">2. BLAZIUM_ANALYTICS_CONSENT</text>
  <text x="730.0" y="394.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">environment variable</text><rect x="990" y="300" width="400" height="140" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1190.0" y="362.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">3. set_consent()</text>
  <text x="1190.0" y="394.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">game code</text><rect x="1440" y="300" width="400" height="140" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1640.0" y="362.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">4. Editor Settings</text>
  <text x="1640.0" y="394.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">unset / accepted / declined</text><rect x="520" y="560" width="880" height="170" rx="14" fill="#1c1828" stroke="#e070ff" stroke-width="2"/>
  <text x="960.0" y="637.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">flush() posts {"events":[...]}</text>
  <text x="960.0" y="669.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">Empty editor endpoint means nothing is collected</text>
  <text x="64" y="1028" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">require_user_consent defaults to false for analytics and true for crash uploads. They are different switches.</text>
</svg>
