<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>Identity flow</title>
  <desc>Steam ticket, Discord OAuth, or Login Service issue a JWT. Lobby or your backend consume it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e070ff"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="118" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">Identity flow</text>
  <rect x="80" y="400" width="280" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="220.0" y="468.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Steam ticket</text>
<text x="220.0" y="502.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">Steam.initialize</text>  <rect x="80" y="640" width="280" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="220.0" y="708.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Discord OAuth</text>
<text x="220.0" y="742.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">LoginClient</text>  <rect x="480" y="520" width="300" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="630.0" y="588.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">JWT</text>
<text x="630.0" y="622.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">JWTBuilder / DecodedJWT</text>  <rect x="900" y="400" width="300" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1050.0" y="468.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Lobby</text>
<text x="1050.0" y="502.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">LobbyClient</text>  <rect x="900" y="640" width="300" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1050.0" y="708.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Your backend</text>
<text x="1050.0" y="742.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">authenticate_with_server</text>  <rect x="1360" y="520" width="460" height="160" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1590.0" y="588.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Play</text>
<text x="1590.0" y="622.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">matchmaking  or  store session</text>  <line x1="360" y1="480" x2="480" y2="580" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="720" x2="480" y2="620" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="560" x2="900" y2="480" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="840.0" y="508.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" text-anchor="middle">claim</text>  <line x1="780" y1="640" x2="900" y2="720" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="840.0" y="668.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" text-anchor="middle">ticket</text>  <line x1="1200" y1="480" x2="1360" y2="580" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1200" y1="720" x2="1360" y2="620" stroke="#8a7aa8" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
