<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>Two version numbers</title>
  <desc>Godot compatibility line vs Blazium product line. Templates use Blazium.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7aa8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e070ff"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#121018"/>
  <text x="64" y="72" fill="#e070ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BLAZIUM</text>
  <text x="64" y="118" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">Two version numbers</text>
  <rect x="120" y="280" width="760" height="420" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="500.0" y="478.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Godot line</text>
<text x="500.0" y="512.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">4.3.2  stable</text>  <rect x="1040" y="280" width="760" height="420" rx="14" fill="#1c1828" stroke="#6b4a9e" stroke-width="2"/>
  <text x="1420.0" y="478.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Blazium product</text>
<text x="1420.0" y="512.0" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="middle">0.6.x   (0.6.725 current release)</text><text x="500" y="780" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" text-anchor="middle">version.py  VERSION_*</text><text x="1420" y="780" fill="#b7acc8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" text-anchor="middle">version.py  EXTERNAL_VERSION_*</text>  <rect x="120" y="860" width="1680" height="140" rx="14" fill="#252033" stroke="#6b4a9e" stroke-width="2"/>
  <text x="960.0" y="930.0" fill="#f4eefc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Export templates install under the Blazium version folder, not 4.3.2.stable</text>
</svg>
