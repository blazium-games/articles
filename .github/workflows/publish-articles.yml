name: Publish Articles

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note for manual sync/bootstrap
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: scripts

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate articles
        run: node validate_articles.js

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log sync reason
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reason != '' }}
        run: echo "Sync reason: ${{ inputs.reason }}"
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate articles
        run: node validate_articles.js

      - name: Build publish tree
        run: node publish_articles.js

      - name: Upload articles to CDN
        uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: dist/articles
          out_dir: articles
