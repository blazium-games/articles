    <style>
      [data-composition-id="scene1-hook"] .canvas {
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse 110% 85% at 50% 15%, #131a22 0%, #06060a 55%);
        position: relative;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      [data-composition-id="scene1-hook"] .wash {
        position: absolute;
        inset: -12%;
        background: radial-gradient(circle at 22% 45%, rgba(71, 140, 191, 0.16) 0%, transparent 42%),
          radial-gradient(circle at 78% 50%, rgba(255, 92, 40, 0.14) 0%, transparent 40%);
      }
      [data-composition-id="scene1-hook"] .grid {
        position: absolute;
        inset: 0;
        opacity: 0.14;
        background-image: linear-gradient(rgba(244, 244, 248, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244, 244, 248, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse at center, black 38%, transparent 72%);
      }
      [data-composition-id="scene1-hook"] .scan {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          rgba(56, 245, 199, 0) 48%,
          rgba(56, 245, 199, 0.04) 50%,
          rgba(56, 245, 199, 0) 52%

        pointer-events: none;
      }
      [data-composition-id="scene1-hook"] .scene-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 100px 120px;
        box-sizing: border-box;
      }
      [data-composition-id="scene1-hook"] .eyebrow {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 22px;
        letter-spacing: 0.28em;
        color: #9ca3b0;
      }
      [data-composition-id="scene1-hook"] .duo {
        display: flex;
        gap: 36px;
        flex-wrap: wrap;
        justify-content: center;
      }
      [data-composition-id="scene1-hook"] .tile {
        width: min(620px, 42vw);
        padding: 38px 36px;
        border-radius: 22px;
        border: 2px solid rgba(244, 244, 248, 0.14);
        background: rgba(18, 18, 26, 0.92);

        color: #38f5c7;

      [data-composition-id="scene1-hook"] .t-name {
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #f4f4f8;
      }
      [data-composition-id="scene1-hook"] .t-name .ver {
        color: #478cbf;

      [data-composition-id="scene1-hook"] .tile.blz .t-name {

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = '[data-composition-id="scene1-hook"]';
        var tl = gsap.timeline({ paused: true });
        tl.from(root + " .eyebrow", { y: 24, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.1);
        tl.from(root + " .tile", { y: 50, opacity: 0, duration: 0.55, stagger: 0.12, ease: "back.out(1.15)" }, 0.35);
        tl.from(root + " .sub", { opacity: 0, y: 18, duration: 0.45, ease: "power3.out" }, 0.85);
        tl.to(root + " .scene-content", { opacity: 0, scale: 0.97, duration: 0.45, ease: "power3.in" }, 4.05);
        tl.to(root + " .canvas", { opacity: 0, duration: 0.35, ease: "power2.in" }, 4.35);
        tl.set(root + " .canvas", { visibility: "hidden" }, 4.75);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-hook"] = tl;
      })();
    </script>
  </div>
