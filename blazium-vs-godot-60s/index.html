<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Blazium vs Godot 4.3 — 60s</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #06060a;
        font-family: "Inter", sans-serif;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .caption-text-wrapper {
        position: absolute;
        bottom: 110px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
        overflow: visible;
        padding: 16px 48px;
        min-height: 140px;
      }
      .caption-line {
        color: #f4f4f8;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-align: center;
        text-shadow: 0 4px 22px rgba(0, 0, 0, 0.65);
        transform: translateY(100%);
        opacity: 0;
        max-width: 1380px;
        padding: 0 24px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-1"
        class="scene"
        data-composition-id="scene1-hook"
        data-composition-src="compositions/scene1-hook.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-2a"
        class="scene"
        data-composition-id="scene2a-lineage"
        data-composition-src="compositions/scene2a-lineage.html"
        data-start="5"
        data-duration="22"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-2b"
        class="scene"
        data-composition-id="scene2b-modules"
        data-composition-src="compositions/scene2b-modules.html"
        data-start="27"
        data-duration="23"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-5"
        class="scene"
        data-composition-id="scene5-outro"
        data-composition-src="compositions/scene5-outro.html"
        data-start="50"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="captions-comp"
        data-composition-id="captions"
        data-start="5"
        data-duration="45"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      >
        <div class="caption-text-wrapper" data-layout-allow-overflow>
          <div id="caption-text" class="caption-line">Godot 4.3: scenes, nodes, GDScript—the upstream baseline.</div>
        </div>

        <script>
          (function () {
            var tl = gsap.timeline({ paused: true });
            var text = document.querySelector("#caption-text");

            tl.to(text, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0);
            tl.to(text, { opacity: 0, y: -20, duration: 0.32, ease: "power3.in" }, 6.2);
            tl.set(text, { innerText: "Blazium: Godot fork—watch compatibility notes like you watch frame times.", y: 36 }, 6.55);
            tl.to(text, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.55);

            tl.to(text, { opacity: 0, y: -20, duration: 0.32, ease: "power3.in" }, 13.6);
            tl.set(
              text,
              {
                innerText: "IndieDB articles list concrete Blazium modules—tests, Discord/Web, sockets…",
                y: 36,
              },
              13.95,
            );
            tl.to(text, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 13.95);

            tl.to(text, { opacity: 0, y: -20, duration: 0.32, ease: "power3.in" }, 22.4);
            tl.set(
              text,
              {
                innerText: "Pure upstream vs bundled integrations—optimize for your shipping plan, not forums.",
                y: 36,
              },
              22.75,
            );
            tl.to(text, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 22.75);

            tl.to(text, { opacity: 0, y: -20, duration: 0.34, ease: "power3.in" }, 31.5);
            tl.set(
              text,
              {
                innerText: "Before you commit: diff godotengine.org vs blazium.app release notes.",
                y: 36,
              },
              31.88,
            );
            tl.to(text, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 31.88);
            tl.to(text, { opacity: 0, y: -20, duration: 0.38, ease: "power3.in" }, 41.4);

            window.__timelines = window.__timelines || {};
            window.__timelines["captions"] = tl;
          })();
        </script>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var mainTl = gsap.timeline({ paused: true });

      mainTl.set("#scene-2a", { scale: 1, filter: "blur(0px)" }, 5);
      mainTl.set("#scene-2b", { scale: 1, filter: "blur(0px)" }, 27);
      mainTl.to(
        "#scene-2b",
        { duration: 0.28, scale: 0.94, filter: "blur(8px)", opacity: 0, ease: "power2.in" },
        49.72,
      );

      window.__timelines["main"] = mainTl;
    </script>
  </body>
</html>
